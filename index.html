<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CTS 부품사진">
<meta name="theme-color" content="#0a6fd6">
<title>CTS 부품사진 조회 시스템</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: two screens, one job each. Home = logo + one input + one button + recent. Result = photo grid + one "done" button. */
:root{
  --bg:#eef3fa; --card:#ffffff; --fg:#0f1b2d; --muted:#5b6b82; --line:#dfe6f0; --soft:#f3f6fb;
  --b1:#0a6fd6; --b2:#1649b8; --b3:#0b2a66; --accent:#0a6fd6; --accent-fg:#ffffff; --hero-fg:#ffffff; --danger:#d93b3b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro KR","SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07101e; --card:#101a2c; --fg:#eef3fa; --muted:#93a3ba; --line:#1f2c42; --soft:#172238;
  --b1:#1b7fe6; --b2:#143d9c; --b3:#061a44; --accent:#2a8df0; --accent-fg:#ffffff; --hero-fg:#ffffff; --danger:#ff6b6b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#07101e; --card:#101a2c; --fg:#eef3fa; --muted:#93a3ba; --line:#1f2c42; --soft:#172238;
  --b1:#1b7fe6; --b2:#143d9c; --b3:#061a44; --accent:#2a8df0; --accent-fg:#ffffff; --hero-fg:#ffffff; --danger:#ff6b6b; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
.screen{min-height:100%;display:flex;flex-direction:column}
.wrap{max-width:560px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{background:linear-gradient(135deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);color:var(--hero-fg);padding-block:30px 86px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08);top:-220px;right:-140px}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-160px;left:-80px}
.hero .wrap{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.logo{display:flex;flex-direction:column;gap:2px;min-width:0}
.logo .cts{font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1;background:linear-gradient(90deg,#ffffff 0%,#dbe9ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sys{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
.logo .en{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.75;font-weight:600;margin-top:8px}
.brands{display:flex;flex-direction:row;align-items:center;gap:14px;flex:none;padding-top:8px}
.brands img{display:block;width:auto;filter:drop-shadow(0 2px 6px rgba(0,20,60,.35))}
.brands img.gm{height:30px;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,20,60,.35));opacity:.95}
.brands img.chev{height:19px}
.brands img.cad{height:20px}
.logo .sys{white-space:nowrap}
@media (max-width:430px){.logo .cts{font-size:46px}.logo .sys{font-size:20px}.brands{gap:10px}.brands img.gm{height:24px}.brands img.chev{height:15px}.brands img.cad{height:16px}}
@media (max-width:380px){.logo .sys{font-size:18px}.brands{gap:8px}}

/* cards */
.stack{display:flex;flex-direction:column;gap:16px;margin-top:-64px;padding-bottom:24px;position:relative}
.card{background:var(--card);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(10,40,90,.10),0 1px 0 var(--line)}
.lbl{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.inputrow{position:relative}
input.pn{width:100%;font:inherit;font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.05em;padding:18px 60px 18px 18px;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--fg);outline:none;font-variant-numeric:tabular-nums}
input.pn:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,111,214,.15)}
input.pn::placeholder{color:var(--muted);font-family:var(--font);font-size:22px;font-weight:400;letter-spacing:0;opacity:.7}
.hint{font-size:15px;color:var(--muted);margin:-4px 2px 0}
.clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:var(--line);color:var(--muted);font-size:22px;line-height:1;display:none;align-items:center;justify-content:center}
.clear.on{display:flex}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;padding:14px 18px;border-radius:16px;border:0;font:inherit;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--accent-fg);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 20px rgba(10,111,214,.30)}
.btn:active{transform:scale(.985);opacity:.9}
.btn.done{background:var(--fg);color:var(--bg);box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--fg);box-shadow:none;font-weight:700;font-size:19px;min-height:56px}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,input:focus-visible,.gear:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hint{font-size:14px;color:var(--muted);margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--soft);color:var(--fg);font:inherit;font-family:var(--mono);font-size:18px;font-weight:700;padding:12px 16px;border-radius:999px;letter-spacing:.04em;cursor:pointer}
.chip.x{font-family:var(--font);font-weight:500;color:var(--muted);font-size:15px}

/* result */
.topbar{display:flex;align-items:center;gap:14px;padding-block:14px}
.topbar .pnbig{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.05em;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.topbar .tag{font-size:12px;letter-spacing:.2em;opacity:.8;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:block;aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--soft);box-shadow:0 1px 0 var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.state{padding:28px 10px;text-align:center;color:var(--muted);font-size:17px;display:flex;flex-direction:column;gap:14px;align-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.more{display:flex;flex-direction:column;gap:10px}
.sticky{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* settings */
input.txt{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--fg);outline:none}
input.txt:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2 .btn{min-height:52px;font-size:17px}

footer{margin-top:auto;text-align:center;color:var(--muted);font-size:13px;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px}
footer b{color:var(--fg);font-weight:700}
.gear{border:0;background:transparent;color:var(--muted);font-size:16px;padding:6px;cursor:pointer;opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:16px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.spin{animation:none}}
</style>
</head>

<script>
/* ===== 설정: Google 이미지 검색 API (비워 두면 검색 시 구글 이미지가 열립니다) ===== */
var CONFIG = {
  key: "AIzaSyAxwXE0qOibOmoB1gL_0pHnYqlZZyJMWCQ",   // Google Cloud API Key
  cx:  "028fe892660194d1a"                            // Programmable Search Engine ID
};
(function(){
  var $=function(id){return document.getElementById(id)};
  var home=$('home'),result=$('result'),pn=$('pn'),go=$('go'),clear=$('clear'),rpn=$('rpn'),photos=$('photos'),more=$('more');
  var recentcard=$('recentcard'),recent=$('recent'),toast=$('toast');
  $('yr').textContent=new Date().getFullYear();

  function norm(v){ v=(v||'').toUpperCase().replace(/[\s\-\.]/g,''); if(/^P\d/.test(v)) v=v.slice(1); return v; }
  function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
  function load(k,d){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):d }catch(e){ return d } }
  function showToast(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(showToast.t); showToast.t=setTimeout(function(){toast.classList.remove('on')},2200) }
  function gUrl(q){ return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent('GM '+q+' part') }
  function nUrl(q){ return 'https://search.naver.com/search.naver?where=image&query='+encodeURIComponent('GM '+q) }
  function link(cls,txt,href){ var a=document.createElement('a'); a.className='btn '+cls; a.href=href; a.target='_blank'; a.rel='noopener'; a.textContent=txt; return a }

  function renderRecent(){
    var list=load('cts_recent',[]); recent.innerHTML='';
    if(!list.length){ recentcard.hidden=true; return }
    recentcard.hidden=false;
    list.forEach(function(q){ var b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=q; b.onclick=function(){ pn.value=q; search() }; recent.appendChild(b) });
    var x=document.createElement('button'); x.className='chip x'; x.type='button'; x.textContent='기록 지우기'; x.onclick=function(){ store('cts_recent',[]); renderRecent() }; recent.appendChild(x);
  }

  function goHome(){ result.hidden=true; home.hidden=false; pn.value=''; clear.classList.remove('on'); window.scrollTo(0,0) }

  function search(){
    var q=norm(pn.value);
    if(!q){ pn.focus(); showToast('부품번호를 입력해 주세요'); return }
    pn.value=q; pn.blur();
    var list=load('cts_recent',[]).filter(function(x){return x!==q}); list.unshift(q); store('cts_recent',list.slice(0,12)); renderRecent();
    rpn.textContent=q; photos.innerHTML=''; more.innerHTML='';
    home.hidden=true; result.hidden=false; window.scrollTo(0,0);
    if(CONFIG.key && CONFIG.cx){ fetchPhotos(q,CONFIG) } else { openGoogle(q) }
  }

  function openGoogle(q){
    var w=null; try{ w=window.open(gUrl(q),'_blank') }catch(e){}
    var st=document.createElement('div'); st.className='state';
    st.innerHTML=w?'<div>구글 이미지에서 사진을 열었습니다.<br>다 보셨으면 아래 확인 완료를 눌러 주세요.</div>':'<div>아래 버튼을 누르면 사진이 열립니다.</div>';
    photos.appendChild(st);
    more.appendChild(link('',w?'🖼 사진 다시 열기':'🖼 사진 보기',gUrl(q)));
    more.appendChild(link('ghost','네이버에서도 보기',nUrl(q)));
  }

  function fetchPhotos(q,cfg){
    var st=document.createElement('div'); st.className='state'; st.innerHTML='<div class="spin"></div><div>사진을 찾는 중입니다</div>'; photos.appendChild(st);
    var url='https://www.googleapis.com/customsearch/v1?key='+encodeURIComponent(cfg.key)+'&cx='+encodeURIComponent(cfg.cx)+'&searchType=image&num=10&q='+encodeURIComponent('GM '+q);
    fetch(url).then(function(r){return r.json()}).then(function(d){
      photos.innerHTML='';
      var items=(d&&d.items)||[];
      if(!items.length){ var e=document.createElement('div'); e.className='state'; e.textContent=(d&&d.error)?'설정이 올바르지 않습니다. 구글 이미지로 보여드립니다.':'사진을 찾지 못했습니다. 구글 이미지로 보여드립니다.'; photos.appendChild(e); more.appendChild(link('','🖼 구글 이미지에서 보기',gUrl(q))); return }
      var g=document.createElement('div'); g.className='grid';
      items.forEach(function(it){
        var a=document.createElement('a'); a.className='tile'; a.href=it.link; a.target='_blank'; a.rel='noopener';
        var im=document.createElement('img'); im.src=(it.image&&it.image.thumbnailLink)||it.link; im.alt=it.title||q; im.referrerPolicy='no-referrer'; im.loading='lazy';
        im.onerror=function(){ a.remove() };
        a.appendChild(im); g.appendChild(a);
      });
      photos.appendChild(g);
      more.appendChild(link('ghost','사진 더 보기 (구글 이미지)',gUrl(q)));
    }).catch(function(){ photos.innerHTML=''; openGoogle(q) });
  }

  go.addEventListener('click',search);
  pn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); search() } });
  pn.addEventListener('input',function(){ clear.classList.toggle('on',pn.value.length>0) });
  clear.addEventListener('click',function(){ pn.value=''; clear.classList.remove('on'); pn.focus() });
  $('done').addEventListener('click',goHome);

  renderRecent();
})();
</script>
